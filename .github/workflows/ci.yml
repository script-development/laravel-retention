name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP 8.5
              uses: shivammathur/setup-php@728c6c6b8cf02c2e48117716a91ee48313958a19 # v2
              with:
                  php-version: '8.5'
                  coverage: pcov
                  tools: composer:v2

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Audit dependencies
              run: composer audit

            - name: Format check
              run: composer format:check

            - name: Static analysis
              run: composer phpstan

            - name: Tests with coverage
              run: composer test:coverage

            - name: Coverage threshold gate
              run: composer coverage:check

            - name: Mutation testing
              run: composer mutation:ci

            - name: Upload reports
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: reports
                  path: |
                      build/logs/clover.xml
                      build/logs/infection.*
                  retention-days: 14
                  if-no-files-found: ignore

    # The manifest floor is a claim: install the lowest versions it admits and run the suite on them.
    check-lowest:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP 8.5
              uses: shivammathur/setup-php@728c6c6b8cf02c2e48117716a91ee48313958a19 # v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer:v2

            - name: Install the lowest dependencies
              run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction

            - name: Assert the floor resolved (testbench pulls laravel/framework, which replaces illuminate/*)
              run: composer show laravel/framework | grep -qE '^versions.*\* v13\.39\.'

            - name: Tests
              run: composer test

    ci-passed:
        name: ci-passed
        runs-on: ubuntu-latest
        needs: [check, check-lowest]
        if: always()
        steps:
            # Enumerates the good state: every lane `success`. A skipped or cancelled lane fails, and so does an empty set.
            - name: Verify every upstream lane succeeded
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  set -euo pipefail

                  echo "upstream lane results: ${RESULTS:-<none>}"

                  if [ -z "${RESULTS//[[:space:]]/}" ]; then
                      echo "::error::ci-passed received no upstream results, so it is gating nothing."
                      exit 1
                  fi

                  for result in $RESULTS; do
                      if [ "$result" != "success" ]; then
                          echo "::error::An upstream CI lane reported '$result'. ci-passed requires every lane to succeed."
                          exit 1
                      fi
                  done
